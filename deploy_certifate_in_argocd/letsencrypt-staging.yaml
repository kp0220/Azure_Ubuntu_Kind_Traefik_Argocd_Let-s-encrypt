# cert-manager API version for issuer resources.
apiVersion: cert-manager.io/v1
# Cluster-wide issuer usable by Certificates in any namespace.
kind: ClusterIssuer
# Kubernetes resource identity; ClusterIssuer has no namespace.
metadata:
  # Referenced by Certificate resources that request test certificates.
  name: letsencrypt-staging
# ACME account and challenge configuration.
spec:
  acme:
    # Contact email for ACME account notices; replace with an email you monitor.
    email: kavit1986@gmail.com

    # Let's Encrypt staging endpoint; issued certificates are not browser-trusted.
    server: https://acme-staging-v02.api.letsencrypt.org/directory

    # Secret used to persist the ACME account private key; do not delete casually.
    privateKeySecretRef:
      # cert-manager creates this Secret in the cluster resource namespace.
      name: letsencrypt-staging-account-key

    # Configure how cert-manager proves control of requested DNS names.
    solvers:
      # Use HTTP-01; public HTTP traffic on port 80 must reach the cluster.
      - http01:
          # Route the temporary challenge Ingress through Traefik.
          ingress:
            # Must match the IngressClass handled by the Traefik controller.
            ingressClassName: traefik

