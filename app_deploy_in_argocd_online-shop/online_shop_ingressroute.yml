# Traefik custom-resource API version for IngressRoute.
apiVersion: traefik.io/v1alpha1
# Declares this resource as a Traefik IngressRoute.
kind: IngressRoute
# Kubernetes resource identity and namespace.
metadata:
  # Name used to identify this route resource.
  name: online-shop-ingressroute
  # Keep the route within the online-shop application namespace.
  namespace: online-shop

# Listener, request routing, and TLS configuration.
spec:
  # Accept external HTTPS requests through Traefik.
  entryPoints:
    - websecure

  # Rules that match requests and forward them to Kubernetes Services.
  routes:
    # Match requests for the public hostname of the online shop.
    - match: Host(`app.yogifoods.store`)
      # Traefik rule type used to evaluate the hostname match expression.
      kind: Rule

      # Backend Kubernetes Service for matching requests.
      services:
        # Online shop application Service in the online-shop namespace.
        - name: online-shop-service
          # Service port exposed by online-shop-service, not necessarily the container port.
          port: 3000

  # TLS Secret used by Traefik to terminate HTTPS for this host.
  tls:
    secretName: online-shop-tls
