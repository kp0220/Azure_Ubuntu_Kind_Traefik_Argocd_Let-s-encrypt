# Traefik custom-resource API version for IngressRoute.
apiVersion: traefik.io/v1alpha1
# Declares this resource as a Traefik IngressRoute.
kind: IngressRoute
# Kubernetes resource identity and namespace.
metadata:
  # Name used to identify this route resource.
  name: chai-app-ingressroute``
  # Keep the route with the Chai app Service and TLS Secret.
  namespace: chai-app

# Listener, request routing, and TLS configuration.
spec:
  # Accept external HTTPS requests through Traefik.
  entryPoints:
    - websecure

  # Rules that match requests and forward them to Kubernetes Services.
  routes:
    # Match requests for the Chai app's public hostname.
    - match: Host(`chaiapp.yogifoods.store`)
      # Traefik rule type used to evaluate the match expression.
      kind: Rule

      # Backend Kubernetes Service for matching requests.
      services:
        # Chai application Service in the chai-app namespace.
        - name: chai-app-service
          # Service port exposed by chai-app-service, not necessarily its container port.
          port: 3000

  # TLS Secret used by Traefik for HTTPS on this route.
  tls:
    secretName: chai-app-tls
