# cert-manager API version for Certificate resources.
apiVersion: cert-manager.io/v1
# Requests a TLS certificate managed and renewed by cert-manager.
kind: Certificate
# Certificate resource identity and namespace.
metadata:
  # Name used to refer to this Certificate resource.
  name: chai-app-tls
  # The TLS Secret is created in this namespace for the app's route.
  namespace: chai-app
# Desired certificate configuration.
spec:
  # Secret where cert-manager stores the issued certificate and private key.
  secretName: chai-app-tls

  # Select the issuer that requests and renews the certificate.
  issuerRef:
    # Must match an existing ClusterIssuer.
    name: letsencrypt-prod
    # ClusterIssuer is cluster-scoped and can serve this namespace.
    kind: ClusterIssuer

  # DNS name included in the certificate; align it with the app route hostname.
  dnsNames:
    - chaiapp.yogifoods.store
