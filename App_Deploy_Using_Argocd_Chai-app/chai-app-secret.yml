# Core Kubernetes API version for a Secret.
apiVersion: v1
# Stores sensitive configuration for use by Kubernetes workloads.
kind: Secret
# Secret identity within the Kubernetes namespace.
metadata:
  # Name referenced by the Chai app Deployment.
  name: chai-app-secret
# Opaque Secret for arbitrary key/value data.
type: Opaque
# Secret values here must be base64-encoded; base64 is not encryption.
data:
  # Environment-variable key consumed by the application; keep its value private.
  VITE_GEMINI_API: QUl6YVN5RDBpN0plSFMzYm1VWkFpa3NCcjJYLU41LVlGQVZXMGZJ
