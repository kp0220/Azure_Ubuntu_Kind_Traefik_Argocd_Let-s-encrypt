# Traefik custom-resource API version for IngressRoute.
apiVersion: traefik.io/v1alpha1
# Declares this resource as a Traefik IngressRoute.
kind: IngressRoute
# Kubernetes resource identity and namespace.
metadata:
  # Name of this route resource.
  name: grafana
  # Keep the route with Grafana's Service and TLS Secret.
  namespace: monitoring
# Traefik listener, routing rules, and TLS configuration.
spec:
  # Accept requests on Traefik's HTTPS entry point.
  entryPoints:
    - websecure

  # Rules that match incoming requests and select backend Services.
  routes:
    # Evaluate this route when the hostname rule matches.
    - kind: Rule
      # Match requests sent to the Grafana public hostname.
      match: Host(`grafana.yogifoods.store`)
      # Kubernetes Service that receives matching requests.
      services:
        # Grafana Service in the monitoring namespace.
        - name: monitoring-grafana
          # Service port that Traefik connects to inside the cluster.
          port: 80

  # TLS certificate Secret used for HTTPS at Traefik.
  tls:
    secretName: grafana-tls

