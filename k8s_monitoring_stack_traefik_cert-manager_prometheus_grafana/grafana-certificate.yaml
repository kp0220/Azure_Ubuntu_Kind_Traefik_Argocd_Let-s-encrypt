# cert-manager API version for Certificate resources.
apiVersion: cert-manager.io/v1
# Requests a TLS certificate managed by cert-manager.
kind: Certificate
# Kubernetes resource identity and namespace.
metadata:
  # Name used to refer to this Certificate resource.
  name: grafana-tls
  # The TLS Secret will be created in this namespace for Grafana's Ingress.
  namespace: monitoring
# Desired certificate configuration.
spec:
  # Secret where cert-manager stores the issued certificate and private key.
  secretName: grafana-tls
  # Select the issuer that obtains and renews the certificate.
  issuerRef:
    # Must match an existing ClusterIssuer.
    name: letsencrypt-prod
    # ClusterIssuer can issue certificates across namespaces.
    kind: ClusterIssuer
  # DNS name to include in the certificate; keep it aligned with the Ingress host.
  dnsNames:
    - grafana.yogifoods.store

