# Kubernetes API version for the Ingress resource.
apiVersion: networking.k8s.io/v1
# Routes HTTP(S) requests to a Kubernetes Service.
kind: Ingress
# Resource identity and namespace.
metadata:
  # Name of this Ingress resource.
  name: grafana
  # Keep the Ingress alongside the Grafana Service and TLS Secret.
  namespace: monitoring
  # Traefik-specific settings for this route.
  annotations:
    # Handle requests on Traefik's HTTPS entry point.
    traefik.ingress.kubernetes.io/router.entrypoints: websecure
    # Enable TLS for this Traefik router.
    traefik.ingress.kubernetes.io/router.tls: "true"
# Host, TLS, and backend routing rules.
spec:
  # Ingress controller class that should handle this resource.
  ingressClassName: traefik

  # TLS certificate configuration for the hostname.
  tls:
    - hosts:
        # Must match the public hostname and the certificate DNS name.
        - grafana.yogifoods.store
      # Secret containing the TLS certificate and private key.
      secretName: grafana-tls

  # Map incoming host and path requests to backend Services.
  rules:
    # Match requests sent to the Grafana hostname.
    - host: grafana.yogifoods.store
      # Define HTTP path matching and its backend.
      http:
        paths:
          # Match the root path and all paths below it.
          - path: /
            # Prefix matching includes nested paths such as /login.
            pathType: Prefix
            # Kubernetes Service that receives matching requests.
            backend:
              service:
                # Grafana Service name in the monitoring namespace.
                name: monitoring-grafana
                # Service port, not the container's target port.
                port:
                  number: 80

