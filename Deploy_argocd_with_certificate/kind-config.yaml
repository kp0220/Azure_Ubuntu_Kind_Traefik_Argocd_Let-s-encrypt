kind: Cluster
apiVersion: kind.x-k8s.io/v1alpha4

nodes:
  - role: control-plane
    extraPortMappings:
      - containerPort: 30080
        hostPort: 80
        protocol: TCP
        listenAddress: "0.0.0.0"

      - containerPort: 30443
        hostPort: 443
        protocol: TCP
        listenAddress: "0.0.0.0"

  - role: worker

  - role: worker

