# cert-manager API version that defines the Certificate resource.
apiVersion: cert-manager.io/v1

# Kubernetes resource type.
kind: Certificate

# Identifies this resource and the namespace it belongs to.
metadata:
  # Name used to refer to this Certificate resource.
  name: argocd-tls
  # Namespace where cert-manager creates the TLS Secret.
  namespace: argocd

# Desired certificate configuration.
spec:
  # Name of the Secret that will hold the certificate and private key.
  secretName: argocd-tls

  # Reference to the issuer that will request the certificate.
  issuerRef:
    # Must match the name of an existing issuer.
    name: letsencrypt-staging
    # ClusterIssuer is cluster-scoped, unlike a namespaced Issuer.
    kind: ClusterIssuer

  # DNS names included in the certificate's subject alternative names.
  dnsNames:
    # Must match the public hostname routed to Argo CD.
    - argocd.yogifoods.store


